name: CI

# Runs on every pull request and push (except main, which is covered by
# deploy.yml, and dependabot branches).
# Single job: lint + format + typecheck + JSON-schema validate + build smoke.
# Catches regressions before they hit main.
#
# Dependabot PRs NEVER run CI. The `checks` job is gated on both the run actor
# and the PR author, so a dependabot PR stays skipped even when a human re-runs
# it (github.actor becomes the human, but the PR author is still dependabot).
# Dependabot updates are reviewed and consolidated manually. Any NEW workflow
# that triggers on `pull_request` MUST replicate this guard.

on:
  pull_request:
  push:
    branches-ignore: [main, "dependabot/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: ${{ github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Run checks (lint + format + typecheck + validate)
        run: npm run checks

      - name: Build smoke
        run: npm run build
